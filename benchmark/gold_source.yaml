# Benchmark source (human-edited). `python -m kg.eval.make_benchmark` turns this into
# benchmark/test.jsonl and benchmark/dev.jsonl, computing derived golden answers from the gold facts.
#
# How every item was made:
#   1. question drafted while reading the filing PDFs (before the system's graph existed);
#   2. each gold fact located on its PDF page (1-based physical page of data/pdfs/<doc>),
#      preferring the primary financial statement page; `alt` lists other pages printing the same value;
#   3. `printed` is the exact string on the page; value = printed x scale;
#   4. kg.eval.gold_check verifies the printed string is on the cited page, and cross-checks
#      numbers against SEC XBRL (`xbrl:` concept) - XBRL is never used by the system itself;
#   5. reviewed by hand (Anmol).
#
# Fact fields: t ticker | m metric (canonical name, for readability) | printed | scale (default 1e6
#   for USD) | unit | end (period end date) | page | doc (main|ex13, default main) | alt pages | xbrl
# Relation facts: t | rel | obj (ticker if the object is in the corpus, else a name) | page | quote

test:
